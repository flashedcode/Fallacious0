<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Streamer</title>
    <style>
        :root {
            --f1: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --f3: 'Courier New', Courier, monospace;
            --c1: #00e5ff;
            --c3: #ff003c;
            --dim: #666666;
            --bg: #04040e;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: var(--f1);
            margin: 0;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
        }

        #searchInput {
            padding: 10px 15px;
            background: #07071a;
            border: 1px solid var(--c1);
            color: white;
            border-radius: 4px;
            font-family: var(--f3);
            width: 250px;
        }

        #searchInput:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .cta-btn {
            padding: 10px 20px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--c1);
            color: var(--c1);
            cursor: pointer;
            border-radius: 4px;
            font-family: var(--f3);
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        #resultsGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .game-card {
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        #playerView {
            display: none;
        }

        #videoPlayer {
            width: 100%;
            aspect-ratio: 16/9;
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 8px;
            margin: 20px 0;
            background: #000;
        }

        #episodeGrid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .play-btn {
            background: transparent;
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--c1);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            background: rgba(0, 229, 255, 0.1) !important;
            border-color: var(--c1) !important;
        }

        /* Custom Scrollbar for episodes */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--c1);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <div class="header">
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="searchInput" placeholder="Search anime..." onkeyup="if(event.key === 'Enter') searchAnime()">
            <button class="cta-btn" onclick="searchAnime()">SEARCH</button>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="userProfile" style="display: none; color: var(--c1); font-family: var(--f3); font-size: 12px; font-weight: bold; letter-spacing: 1px;"></span>
            <button id="loginBtn" class="cta-btn">LOGIN</button>
            <button id="logoutBtn" class="cta-btn" style="display: none; border-color: var(--c3); color: var(--c3);">LOGOUT</button>
        </div>
    </div>

    <!-- Home / Search Results -->
    <div id="resultsGrid"></div>

    <!-- Video Player View -->
    <div id="playerView">
        <button class="cta-btn" onclick="goBack()" style="margin-bottom: 20px;">&larr; BACK TO BROWSING</button>
        
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
            <h2 id="watchTitle" style="margin: 0; font-size: 24px; font-weight: 700;"></h2>
            <span id="episodeCountBadge" style="background: rgba(0,229,255,0.2); border: 1px solid var(--c1); color: var(--c1); padding: 4px 10px; font-size: 11px; font-family: var(--f3); border-radius: 4px; font-weight: bold;"></span>
        </div>

        <!-- 
          SANDBOXED IFRAME:
          allow-scripts: Needed for the video player to run.
          allow-same-origin: Needed for the video stream to load correctly.
          allow-forms: (Optional) if the player requires it.
          MISSING allow-popups & allow-top-navigation: This blocks the intrusive popup ads and forced redirects.
          referrerpolicy="no-referrer": Prevents the host from seeing where the request originated.
        -->
        <iframe 
            id="videoPlayer" 
            sandbox="allow-scripts allow-same-origin allow-forms" 
            referrerpolicy="no-referrer" 
            allowfullscreen>
        </iframe>
        
        <div style="font-family: var(--f3); color: var(--c1); font-size: 14px; letter-spacing: 2px; margin-top: 20px; border-bottom: 1px solid rgba(0,229,255,0.2); padding-bottom: 10px;">EPISODES</div>
        <div id="episodeGrid"></div>
    </div>

<script>
    let currentAnimeId = null;
    let currentAnimeTitle = '';
    let totalEpisodes = 12;

    const recommendedIds = [174154, 145064, 40748, 1735, 269, 21, 101922, 11061, 16498];

    // Load Recommended Feed on startup
    async function loadRecommended() {
        const grid = document.getElementById('resultsGrid');
        if(!grid) return;
        
        // Save any existing continue watching banner before clearing
        const banner = document.getElementById('continueWatchingBanner');
        
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:var(--f3);color:var(--c1);">Loading recommended hits...</div>';

        const graphqlQuery = `
            query ($idIn: [Int]) {
                Page (perPage: 12) {
                    media (id_in: $idIn, type: ANIME, sort: POPULARITY_DESC) {
                        id
                        title { romaji english }
                        coverImage { large }
                        episodes
                    }
                }
            }
        `;

        try {
            const response = await fetch('https://graphql.anilist.co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: graphqlQuery, variables: { idIn: recommendedIds } })
            });
            const data = await response.json();
            const animeList = data.data.Page.media;

            grid.innerHTML = '<div style="grid-column:1/-1;margin-bottom:5px;display:flex;align-items:center;gap:15px;"><div style="height:1px;background:linear-gradient(90deg,var(--c1),transparent);flex:1;"></div><div style="font-family:var(--f3);font-size:12px;letter-spacing:4px;color:var(--c1);text-transform:uppercase;">Trending Hits</div><div style="height:1px;background:linear-gradient(270deg,var(--c1),transparent);flex:1;"></div></div>';

            // Put the banner back if it existed
            if(banner) grid.prepend(banner);

            renderCards(animeList, grid);
        } catch (err) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:var(--f3);color:var(--dim);">Type an anime name above to begin streaming.</div>';
            if(banner) grid.prepend(banner);
        }
    }

    async function searchAnime() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) {
            loadRecommended();
            return;
        }

        const grid = document.getElementById('resultsGrid');
        const banner = document.getElementById('continueWatchingBanner');
        
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:var(--f3);color:var(--c1);">Searching database...</div>';

        const graphqlQuery = `
            query ($search: String) {
                Page (perPage: 20) {
                    media (search: $search, type: ANIME) {
                        id
                        title { romaji english }
                        coverImage { large }
                        episodes
                    }
                }
            }
        `;

        try {
            const response = await fetch('https://graphql.anilist.co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: graphqlQuery, variables: { search: query } })
            });

            const data = await response.json();
            const animeList = data.data.Page.media;

            grid.innerHTML = '';
            if(banner) grid.prepend(banner);
            
            if (animeList.length === 0) {
                grid.innerHTML += '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:var(--f3);color:var(--dim);">No anime found matching your search.</div>';
                return;
            }

            renderCards(animeList, grid);
        } catch (err) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;font-family:var(--f3);color:var(--c3);">Failed to fetch search results. Check your connection.</div>';
            if(banner) grid.prepend(banner);
        }
    }

    function renderCards(animeList, grid) {
        animeList.forEach(anime => {
            const title = anime.title.english || anime.title.romaji;
            const eps = anime.episodes || '?';
            const card = document.createElement('div');
            card.className = 'game-card';
            card.style.cursor = 'pointer';
            card.onclick = () => selectAnime(anime.id, title, anime.episodes);

            card.innerHTML = `
                <div style="aspect-ratio:3/4;overflow:hidden;background:#07071a;border-radius:6px;margin-bottom:14px;position:relative;">
                    <img src="${anime.coverImage.large}" alt="${title}" style="width:100%;height:100%;object-fit:cover;transition:transform 0.4s;" onmouseenter="this.style.transform='scale(1.05)'" onmouseleave="this.style.transform='scale(1)'">
                    <span style="position:absolute;bottom:8px;right:8px;background:rgba(4,4,14,0.85);font-family:var(--f3);font-size:9px;padding:3px 6px;border-radius:4px;color:var(--c1);border:1px solid rgba(0,229,255,0.2);">${eps} EPS</span>
                </div>
                <div style="font-family:var(--f3);font-size:9px;letter-spacing:2px;color:var(--c1);margin-bottom:6px;">ANIME</div>
                <h3 style="font-family:var(--f1);font-size:13px;font-weight:700;color:#e4e8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;">${title}</h3>
            `;
            grid.appendChild(card);
        });
    }

    // Make selectAnime available globally so the Firebase script can click it
    window.selectAnime = function(id, title, eps) {
        currentAnimeId = id;
        currentAnimeTitle = title;
        totalEpisodes = eps || 12;

        document.getElementById('resultsGrid').style.display = 'none';
        document.getElementById('playerView').style.display = 'block';
        document.getElementById('watchTitle').innerText = title;
        document.getElementById('episodeCountBadge').innerText = `${totalEpisodes} Episodes`;

        buildEpisodeList();
        playEpisode(1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildEpisodeList() {
        const episodeGrid = document.getElementById('episodeGrid');
        episodeGrid.innerHTML = '';
        const limit = Math.min(totalEpisodes, 1500);

        for (let i = 1; i <= limit; i++) {
            const btn = document.createElement('button');
            btn.id = `ep-btn-${i}`;
            btn.className = 'play-btn';
            btn.style.padding = '8px 14px';
            btn.style.fontSize = '12px';
            btn.style.fontFamily = 'var(--f3)';
            btn.innerText = `EP ${i}`;
            btn.onclick = () => playEpisode(i);
            episodeGrid.appendChild(btn);
        }
    }

    function playEpisode(epNum) {
        // Clear previous active styles using the site's native neon theme variables
        document.querySelectorAll('#episodeGrid button').forEach(b => {
            b.style.background = 'transparent';
            b.style.color = 'var(--c1)';
            b.style.borderColor = 'rgba(0,229,255,0.3)';
        });

        // Highlight active episode
        const activeBtn = document.getElementById(`ep-btn-${epNum}`);
        if(activeBtn) {
            activeBtn.style.background = 'rgba(0,229,255,0.1)';
            activeBtn.style.color = '#fff';
            activeBtn.style.borderColor = 'var(--c1)';
        }

        // Set Stream Source
        document.getElementById('videoPlayer').src = `https://megaplay.buzz/stream/ani/${currentAnimeId}/${epNum}/sub`;

        // Save progress to Firebase
        if (window.saveEpisodeProgress) {
            window.saveEpisodeProgress(currentAnimeId, currentAnimeTitle, epNum, totalEpisodes);
        }
    }

    function goBack() {
        document.getElementById('playerView').style.display = 'none';
        document.getElementById('resultsGrid').style.display = 'grid';
        document.getElementById('videoPlayer').src = ''; // Stop video playback
    }

    // Initialize Home Page
    loadRecommended();
</script>

<!-- FIREBASE BACKEND SCRIPT (Properly Isolated Module) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your actual configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDZ_wsa8mBunnpjefqPWrObMoWsel2TUH4",
        authDomain: "pastpapergenie-auth.firebaseapp.com",
        projectId: "pastpapergenie-auth",
        storageBucket: "pastpapergenie-auth.firebasestorage.app",
        messagingSenderId: "670440449105",
        appId: "1:670440449105:web:e98ce9eb790bca2409c470",
        measurementId: "G-4SP4GQFGPW"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    let currentUser = null;

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userProfile = document.getElementById('userProfile');

    if(loginBtn) {
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => console.error("Login Failed: ", err));
        });
    }

    if(logoutBtn) {
        logoutBtn.addEventListener('click', () => {
            signOut(auth).catch(err => console.error("Logout Failed: ", err));
        });
    }

    // 1. Expose save function to the main script
    window.saveEpisodeProgress = (animeId, title, epNum, totalEps) => {
        if (currentUser && animeId) {
            const userRef = doc(db, "users", currentUser.uid);
            setDoc(userRef, {
                animeId: animeId,
                title: title,
                epNum: epNum,
                totalEps: totalEps,
                lastWatched: new Date()
            }, { merge: true });
        }
    };

    // 2. Watch Auth State and Load Continue Watching UI
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            if(loginBtn) loginBtn.style.display = 'none';
            if(logoutBtn) logoutBtn.style.display = 'inline-flex';
            if(userProfile) {
                userProfile.style.display = 'inline';
                userProfile.innerText = `HELLO, ${user.displayName.toUpperCase()} `;
            }

            // Fetch last watched episode from Firestore
            try {
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    showContinueWatching(data.animeId, data.title, data.epNum, data.totalEps);
                }
            } catch (err) {
                console.error("Error fetching watch history:", err);
            }
            
        } else {
            currentUser = null;
            if(loginBtn) loginBtn.style.display = 'inline-flex';
            if(logoutBtn) logoutBtn.style.display = 'none';
            if(userProfile) userProfile.style.display = 'none';
            removeContinueWatching();
        }
    });

    // 3. UI Builders for Continue Watching
    function showContinueWatching(animeId, title, epNum, totalEps) {
        removeContinueWatching();
        
        const grid = document.getElementById('resultsGrid');
        if(!grid) return;

        const continueDiv = document.createElement('div');
        continueDiv.id = "continueWatchingBanner";
        continueDiv.style = "grid-column:1/-1; background:rgba(0,229,255,0.05); border:1px solid #00e5ff; padding:20px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;";
        
        continueDiv.innerHTML = `
            <div>
                <div style="font-family:var(--f3);font-size:10px;color:#00e5ff;letter-spacing:2px;margin-bottom:5px;">CONTINUE WATCHING</div>
                <h3 style="font-family:var(--f1);color:#fff;font-size:18px;margin:0;">${title} - Episode ${epNum}</h3>
            </div>
            <button class="cta-btn" style="border-color:#00e5ff; cursor:pointer;">RESUME</button>
        `;
        
        continueDiv.querySelector('button').onclick = () => {
            if(window.selectAnime) {
                window.selectAnime(animeId, title, totalEps);
                setTimeout(() => {
                    const epBtn = document.getElementById(`ep-btn-${epNum}`);
                    if(epBtn) {
                        epBtn.click();
                        epBtn.scrollIntoView({behavior: "smooth", block: "center"});
                    }
                }, 500);
            }
        };
        
        grid.prepend(continueDiv);
    }

    function removeContinueWatching() {
        const existing = document.getElementById('continueWatchingBanner');
        if (existing) existing.remove();
    }
</script>
</body>
</html>
</html>
